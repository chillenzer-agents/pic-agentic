[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pic-agentic"
version = "0.0.1"
description = "MCP server and simulation-side client for LLM-driven remote PIConGPU simulations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "mcp==2.1.1",
    "matrix-nio==0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pic_agentic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These tests deliberately mirror C++ std::setw percent formatting.
"tests/test_progress_parser.py" = ["UP031"]
